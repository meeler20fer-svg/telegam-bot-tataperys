<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telegram Tap Clicker</title>
    <!-- Подключаем SDK Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #2a2d3d 0%, #1f212d 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .header {
            margin-top: 15px;
            text-align: center;
        }
        .score-container {
            font-size: 36px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .stats-info {
            font-size: 14px;
            color: #cfd4ed;
            margin-top: 4px;
        }
        .click-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            width: 100%;
            padding: 20px 0;
            flex-wrap: wrap;
        }
        .tap-button {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff007f 0%, #7928ca 100%);
            border: 5px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.5);
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            transition: transform 0.05s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .tap-button:active {
            transform: scale(0.90);
        }
        .floating-text {
            position: absolute;
            font-size: 26px;
            font-weight: bold;
            color: #00ffcc;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-80px) scale(1.2);
            }
        }
        .bottom-panel {
            width: 100%;
            background: #34384a;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
            max-height: 45vh;
            overflow-y: auto;
        }
        .section-title {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 18px;
            color: #ffffff;
            border-bottom: 2px solid #45495e;
            padding-bottom: 6px;
        }
        .card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #41455a;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .card-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .card-title {
            font-weight: bold;
            font-size: 15px;
        }
        .card-level {
            font-size: 12px;
            color: #00ffcc;
            font-weight: 600;
        }
        .card-desc {
            font-size: 12px;
            color: #b3b9d1;
        }
        .buy-btn {
            background: #0088cc;
            border: none;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .buy-btn:disabled {
            background: #55596e;
            color: #8e94a8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-container">
            🪙 <span id="coins">0</span>
        </div>
        <div class="stats-info">
            Сила клика: +<span id="click-power">1</span> | Кнопок: <span id="button-count">1</span>
        </div>
    </div>

    <!-- Область с кнопками -->
    <div class="click-area" id="clickArea">
        <!-- Кнопки генерируются динамически -->
    </div>

    <div class="bottom-panel
