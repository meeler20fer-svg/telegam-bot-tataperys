<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telegram Tap Clicker</title>
    <!-- Подключаем SDK Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #2a2d3d 0%, #1f212d 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .header {
            margin-top: 15px;
            text-align: center;
        }
        .score-container {
            font-size: 36px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .stats-info {
            font-size: 14px;
            color: #cfd4ed;
            margin-top: 4px;
        }
        .click-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            width: 100%;
            padding: 20px 0;
            flex-wrap: wrap;
        }
        .tap-button {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff007f 0%, #7928ca 100%);
            border: 5px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.5);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .tap-button.active-tap {
            transform: scale(0.88);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.8);
        }
        .floating-text {
            position: absolute;
            font-size: 26px;
            font-weight: bold;
            color: #00ffcc;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-80px) scale(1.2);
            }
        }
        .bottom-panel {
            width: 100%;
            background: #34384a;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
            max-height: 45vh;
            overflow-y: auto;
        }
        .section-title {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 18px;
            color: #ffffff;
            border-bottom: 2px solid #45495e;
            padding-bottom: 6px;
        }
        .card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #41455a;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .card-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .card-title {
            font-weight: bold;
            font-size: 15px;
        }
        .card-level {
            font-size: 12px;
            color: #00ffcc;
            font-weight: 600;
        }
        .card-desc {
            font-size: 12px;
            color: #b3b9d1;
        }
        .buy-btn {
            background: #0088cc;
            border: none;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .buy-btn:disabled {
            background: #55596e;
            color: #8e94a8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-container">
            🪙 <span id="coins">0</span>
        </div>
        <div class="stats-info">
            Сила клика: +<span id="click-power">1</span> | Доход за тап: +<span id="total-per-tap">1</span> (х<span id="button-count">1</span> кнопок)
        </div>
    </div>

    <!-- Область с кнопками -->
    <div class="click-area" id="clickArea"></div>

    <div class="bottom-panel">
        <!-- Секция улучшений -->
        <h3 class="section-title">Улучшения</h3>
        <div class="card">
            <div class="card-info">
                <span class="card-title">Увеличение силы клика</span>
                <span class="card-level">Уровень: <span id="upgradeLevel">0</span></span>
                <span class="card-desc">+1 к монетам за каждый клик</span>
            </div>
            <button class="buy-btn" id="buyUpgradeBtn">
                <span id="upgradeCost">10</span> 🪙
            </button>
        </div>

        <!-- Секция Магазина -->
        <h3 class="section-title" style="margin-top: 15px;">Магазин</h3>
        <div class="card">
            <div class="card-info">
                <span class="card-title">Дополнительная кнопка</span>
                <span class="card-level">Куплено: <span id="shopButtonLevel">0</span></span>
                <span class="card-desc">Все кнопки нажимаются одновременно, удваивая доход</span>
            </div>
            <button class="buy-btn" id="buyButtonBtn">
                <span id="buttonCost">500</span> 🪙
            </button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.expand();
            }

            // Состояние игры
            let state = {
                coins: 0,
                clickPower: 1,
                upgradeLevel: 0,
                upgradeCost: 10,
                buttonsCount: 1,
                buttonCost: 500
            };

            const coinsEl = document.getElementById('coins');
            const clickPowerEl = document.getElementById('click-power');
            const totalPerTapEl = document.getElementById('total-per-tap');
            const buttonCountEl = document.getElementById('button-count');
            const clickArea = document.getElementById('clickArea');
            
            const buyUpgradeBtn = document.getElementById('buyUpgradeBtn');
            const upgradeLevelEl = document.getElementById('upgradeLevel');
            const upgradeCostEl = document.getElementById('upgradeCost');

            const buyButtonBtn = document.getElementById('buyButtonBtn');
            const shopButtonLevelEl = document.getElementById('shopButtonLevel');
            const buttonCostEl = document.getElementById('buttonCost');

            function saveGame() {
                localStorage.setItem('clicker_save_v2', JSON.stringify(state));
            }

            function loadGame() {
                const saved = localStorage.getItem('clicker_save_v2');
                if (saved) {
                    try {
                        state = Object.assign(state, JSON.parse(saved));
                    } catch (e) {
                        console.error("Ошибка сохранения:", e);
                    }
                }
                renderButtons();
                updateUI();
            }

            function renderButtons() {
                clickArea.innerHTML = '';
                for (let i = 0; i < state.buttonsCount; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'tap-button';
                    btn.innerText = 'ТАПАЙ!';
                    btn.addEventListener('click', (e) => handleTap(e));
                    clickArea.appendChild(btn);
                }
            }

            // Одновременное нажатие ВСЕХ кнопок
            function handleTap(e) {
                const earnedCoins = state.clickPower * state.buttonsCount;
                state.coins += earnedCoins;
                
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                }

                // Визуальная анимация нажатия НА ВСЕХ кнопках
                const allButtons = document.querySelectorAll('.tap-button');
                allButtons.forEach(btn => {
                    btn.classList.add('active-tap');
                    setTimeout(() => btn.classList.remove('active-tap'), 100);
                });

                // Показываем единый текст дохода над нажатой точкой
                showFloatingNumber(e.clientX, e.clientY, `+${earnedCoins}`);
                
                saveGame();
                updateUI();
            }

            function showFloatingNumber(x, y, text) {
                const el = document.createElement('div');
                el.className = 'floating-text';
                el.innerText = text;
                
                const rect = clickArea.getBoundingClientRect();
                el.style.left = `${x - rect.left - 10}px`;
                el.style.top = `${y - rect.top - 20}px`;

                clickArea.appendChild(el);

                setTimeout(() => {
                    el.remove();
                }, 800);
            }

            // Покупка клик-улучшения
            buyUpgradeBtn.addEventListener('click', () => {
                if (state.coins >= state.upgradeCost) {
                    state.coins -= state.upgradeCost;
                    state.clickPower += 1;
                    state.upgradeLevel += 1;

                    let nextCost = Math.round(state.upgradeCost * 1.8);
                    if (state.upgradeLevel % 3 === 0) {
                        nextCost += 1000;
                    }
                    state.upgradeCost = nextCost;

                    if (tg && tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }

                    saveGame();
                    updateUI();
                }
            });

            // Покупка новой кнопки
            buyButtonBtn.addEventListener('click', () => {
                if (state.coins >= state.buttonCost) {
                    state.coins -= state.buttonCost;
                    state.buttonsCount += 1;

                    let nextButtonCost = Math.round(state.buttonCost * 2.5);
                    if ((state.buttonsCount - 1) % 3 === 0) {
                        nextButtonCost += 1000;
                    }
                    state.buttonCost = nextButtonCost;

                    if (tg && tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }

                    renderButtons();
                    saveGame();
                    updateUI();
                }
            });

            function updateUI() {
                coinsEl.innerText = state.coins;
                clickPowerEl.innerText = state.clickPower;
                totalPerTapEl.innerText = state.clickPower * state.buttonsCount;
                buttonCountEl.innerText = state.buttonsCount;

                upgradeLevelEl.innerText = state.upgradeLevel;
                upgradeCostEl.innerText = state.upgradeCost;
                buyUpgradeBtn.disabled = state.coins < state.upgradeCost;

                shopButtonLevelEl.innerText = state.buttonsCount - 1;
                buttonCostEl.innerText = state.buttonCost;
                buyButtonBtn.disabled = state.coins < state.buttonCost;
            }

            loadGame();
        });
    </script>
</body>
</html>
